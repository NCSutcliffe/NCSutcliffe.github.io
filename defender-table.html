function DefenderPeriodicTable() {
  const [selected, setSelected] = useState(null);
  const [activeTiers, setActiveTiers] = useState(new Set());
  const [activeGroups, setActiveGroups] = useState(new Set());

  const toggleTier = (tier) => {
    setActiveTiers(prev => {
      const n = new Set(prev);
      n.has(tier) ? n.delete(tier) : n.add(tier);
      return n;
    });
  };

  const toggleGroup = (group) => {
    setActiveGroups(prev => {
      const n = new Set(prev);
      n.has(group) ? n.delete(group) : n.add(group);
      return n;
    });
  };

  const isHighlighted = (el) => {
    if (activeTiers.size === 0 && activeGroups.size === 0) return true;
    const tierMatch = activeTiers.size === 0 || activeTiers.has(el.tier);
    const groupMatch = activeGroups.size === 0 || activeGroups.has(el.group);
    return tierMatch && groupMatch;
  };

  const rows = useMemo(() => {
    const r = {};
    ELEMENTS.forEach(el => {
      if (!r[el.row]) r[el.row] = [];
      r[el.row].push(el);
    });
    return r;
  }, []);

  const ROW_LABELS = {
    1: "MDE P1",
    2: "MDE P2",
    3: "MDO",
    4: "MDI",
    5: "MDA",
    6: "DVM",
    7: "XDR",
  };

  const tc = TIERS;
  const gc = GROUPS;
  const active = selected;

  return (
    <div style={{
      minHeight: "100vh",
      background: "#0A0D14",
      color: "#E2E8F0",
      fontFamily: "'IBM Plex Mono', 'Fira Code', monospace",
      padding: "28px 20px 40px",
      userSelect: "none",
    }}>

      {/* ── Header ── */}
      <div style={{ textAlign: "center", marginBottom: "28px" }}>
        <div style={{
          fontSize: "clamp(16px, 3vw, 30px)",
          fontWeight: 800,
          letterSpacing: "-0.02em",
          fontFamily: "'IBM Plex Sans', system-ui, sans-serif",
          background: "linear-gradient(90deg, #1573E6 0%, #27A49D 50%, #4EB672 100%)",
          WebkitBackgroundClip: "text",
          WebkitTextFillColor: "transparent",
        }}>
          PERIODIC TABLE OF MICROSOFT DEFENDER
        </div>
        <div style={{ fontSize: "11px", color: "#334155", marginTop: "5px", letterSpacing: "0.12em" }}>
          DATA SOURCE: M365MAPS.COM BY AARON DINNAGE · {new Date().toLocaleString('en-GB', {month:'long', year:'numeric'}).toUpperCase()}
        </div>
      </div>

      {/* ── Group filter row ── */}
      <div style={{ display: "flex", flexWrap: "wrap", gap: "6px", justifyContent: "center", marginBottom: "10px" }}>
        {Object.entries(gc).map(([key, g]) => {
          const on = activeGroups.has(key);
          return (
            <button key={key} onClick={() => toggleGroup(key)} style={{
              padding: "4px 12px",
              borderRadius: "4px",
              border: `1px solid ${on ? g.color : g.color + "40"}`,
              background: on ? g.color + "25" : "transparent",
              color: on ? g.color : g.color + "99",
              fontSize: "10px",
              fontWeight: 700,
              letterSpacing: "0.06em",
              cursor: "pointer",
              fontFamily: "inherit",
              transition: "all 0.12s",
            }}>
              {g.label.toUpperCase()}
            </button>
          );
        })}
      </div>

      {/* ── Tier filter row ── */}
      <div style={{ display: "flex", flexWrap: "wrap", gap: "6px", justifyContent: "center", marginBottom: "24px", alignItems: "center" }}>
        <span style={{ fontSize: "9px", color: "#334155", letterSpacing: "0.1em", marginRight: "4px" }}>MIN LICENCE →</span>
        {TIER_ORDER.map(key => {
          const t = tc[key];
          const on = activeTiers.has(key);
          return (
            <button key={key} onClick={() => toggleTier(key)} style={{
              padding: "3px 10px",
              borderRadius: "3px",
              border: `1px solid ${on ? t.color : t.color + "35"}`,
              background: on ? t.color + "20" : "transparent",
              color: on ? t.color : t.color + "70",
              fontSize: "10px",
              fontWeight: 700,
              letterSpacing: "0.04em",
              cursor: "pointer",
              fontFamily: "inherit",
              transition: "all 0.12s",
            }}>
              {t.label.toUpperCase()}
            </button>
          );
        })}
        {(activeTiers.size > 0 || activeGroups.size > 0) && (
          <button onClick={() => { setActiveTiers(new Set()); setActiveGroups(new Set()); }} style={{
            padding: "3px 10px",
            borderRadius: "3px",
            border: "1px solid #EF444460",
            background: "transparent",
            color: "#EF4444",
            fontSize: "10px",
            fontWeight: 700,
            cursor: "pointer",
            fontFamily: "inherit",
            letterSpacing: "0.04em",
          }}>
            ✕ CLEAR
          </button>
        )}
      </div>

      {/* ── Grid ── */}
      <div style={{ overflowX: "auto", paddingBottom: "8px" }}>
        <div style={{ minWidth: "900px", maxWidth: "1200px", margin: "0 auto" }}>
          {Object.entries(rows).map(([rowNum, elements]) => (
            <div key={rowNum} style={{ display: "flex", gap: "5px", marginBottom: "5px", alignItems: "stretch" }}>
              {/* Row label */}
              <div style={{
                width: "38px",
                flexShrink: 0,
                display: "flex",
                alignItems: "center",
                justifyContent: "flex-end",
                paddingRight: "6px",
                fontSize: "9px",
                fontWeight: 700,
                color: "#1E293B",
                letterSpacing: "0.08em",
              }}>
                {ROW_LABELS[+rowNum]}
              </div>

              {[...elements].sort((a, b) => a.col - b.col).map(el => {
                const g = gc[el.group];
                const t = tc[el.tier];
                const lit = isHighlighted(el);
                const isSel = selected?.sym === el.sym;

                return (
                  <div
                    key={el.sym}
                    onClick={() => setSelected(isSel ? null : el)}
                    title={el.name}
                    style={{
                      width: "clamp(58px, 7.5vw, 88px)",
                      height: "clamp(64px, 8.5vw, 96px)",
                      flexShrink: 0,
                      background: isSel
                        ? `linear-gradient(135deg, ${g.color}28, ${g.color}10)`
                        : lit ? "#141923" : "#0C1018",
                      border: isSel
                        ? `2px solid ${g.color}`
                        : lit
                          ? `1px solid ${g.color}35`
                          : "1px solid #111827",
                      borderRadius: "6px",
                      padding: "5px 4px 4px",
                      cursor: "pointer",
                      display: "flex",
                      flexDirection: "column",
                      justifyContent: "space-between",
                      position: "relative",
                      opacity: lit ? 1 : 0.18,
                      transition: "all 0.12s ease",
                      transform: isSel ? "scale(1.06)" : "scale(1)",
                      boxShadow: isSel ? `0 0 14px ${g.color}35` : "none",
                    }}
                  >
                    {/* Atomic num */}
                    <div style={{ fontSize: "8px", color: "#1E293B", fontWeight: 700 }}>
                      {String(el.num).padStart(2, "0")}
                    </div>

                    {/* Symbol */}
                    <div style={{
                      textAlign: "center",
                      fontSize: "clamp(12px, 1.6vw, 18px)",
                      fontWeight: 900,
                      color: isSel ? g.color : lit ? "#C8D8E8" : "#2A3040",
                      fontFamily: "'IBM Plex Sans', sans-serif",
                      letterSpacing: "-0.02em",
                      lineHeight: 1,
                    }}>
                      {el.sym}
                    </div>

                    {/* Name */}
                    <div style={{
                      textAlign: "center",
                      fontSize: "clamp(5px, 0.6vw, 7px)",
                      color: lit ? "#475569" : "#1E293B",
                      lineHeight: 1.3,
                      overflow: "hidden",
                      maxHeight: "22px",
                    }}>
                      {el.name}
                    </div>

                    {/* Tier */}
                    <div style={{
                      textAlign: "center",
                      fontSize: "6px",
                      fontWeight: 800,
                      color: lit ? t.color : t.color + "40",
                      letterSpacing: "0.03em",
                    }}>
                      {t.label}
                    </div>

                    {/* Group colour bar */}
                    <div style={{
                      position: "absolute",
                      bottom: 0, left: 0, right: 0,
                      height: "2.5px",
                      background: g.color,
                      borderRadius: "0 0 5px 5px",
                      opacity: lit ? (isSel ? 1 : 0.5) : 0.1,
                    }} />
                  </div>
                );
              })}
            </div>
          ))}
        </div>
      </div>

      {/* ── Detail panel ── */}
      <div style={{
        maxWidth: "1200px",
        margin: "20px auto 0",
        minHeight: "110px",
        borderRadius: "10px",
        background: active ? "#111827" : "transparent",
        border: active
          ? `1px solid ${GROUPS[active.group].color}35`
          : "1px solid transparent",
        transition: "background 0.15s, border 0.15s",
        overflow: "hidden",
      }}>
        {active ? (() => {
          const g = gc[active.group];
          const t = tc[active.tier];
          return (
            <div style={{ padding: "20px 24px", display: "flex", gap: "24px", alignItems: "flex-start" }}>
              {/* Symbol block */}
              <div style={{ flexShrink: 0, textAlign: "center", width: "72px" }}>
                <div style={{
                  fontSize: "36px", fontWeight: 900,
                  color: g.color,
                  fontFamily: "'IBM Plex Sans', sans-serif",
                  lineHeight: 1,
                }}>
                  {active.sym}
                </div>
                <div style={{ fontSize: "8px", color: "#1E293B", marginTop: "3px" }}>
                  #{String(active.num).padStart(2, "0")}
                </div>
                <div style={{
                  marginTop: "8px",
                  display: "inline-block",
                  padding: "3px 8px",
                  borderRadius: "3px",
                  background: t.color + "18",
                  border: `1px solid ${t.color}50`,
                  fontSize: "9px",
                  fontWeight: 800,
                  color: t.color,
                  letterSpacing: "0.04em",
                }}>
                  {t.label}
                </div>
              </div>

              <div style={{ width: "1px", alignSelf: "stretch", background: g.color + "25" }} />

              {/* Text */}
              <div style={{ flex: 1 }}>
                <div style={{
                  fontSize: "16px", fontWeight: 700,
                  color: "#E2E8F0",
                  fontFamily: "'IBM Plex Sans', sans-serif",
                  marginBottom: "3px",
                }}>
                  {active.name}
                </div>
                <div style={{
                  fontSize: "10px", color: g.color,
                  letterSpacing: "0.08em", marginBottom: "10px",
                  fontWeight: 700, textTransform: "uppercase",
                }}>
                  {g.label} · {t.desc}
                </div>
                <div style={{
                  fontSize: "13px", color: "#8094A8",
                  lineHeight: 1.7,
                  fontFamily: "'IBM Plex Sans', sans-serif",
                }}>
                  {active.desc}
                </div>
                <a
                  href={active.docsUrl}
                  target="_blank"
                  rel="noreferrer"
                  onClick={e => e.stopPropagation()}
                  style={{
                    display: "inline-block",
                    marginTop: "10px",
                    fontSize: "10px",
                    color: "#1573E6",
                    textDecoration: "none",
                    borderBottom: "1px solid #1573E630",
                    letterSpacing: "0.04em",
                    fontWeight: 600,
                  }}
                >
                  DOCS ↗
                </a>
              </div>

              <button onClick={() => setSelected(null)} style={{
                flexShrink: 0, fontSize: "10px", color: "#334155",
                cursor: "pointer", padding: "3px 8px",
                borderRadius: "3px", border: "1px solid #1E293B",
                background: "transparent", fontFamily: "inherit",
                letterSpacing: "0.04em",
              }}>
                ✕
              </button>
            </div>
          );
        })() : (
          <div style={{
            display: "flex", alignItems: "center", justifyContent: "center",
            height: "110px", color: "#1A2234", fontSize: "11px", letterSpacing: "0.1em",
          }}>
            CLICK AN ELEMENT TO INSPECT · FILTER BY LICENCE TIER OR PRODUCT GROUP
          </div>
        )}
      </div>

      {/* ── Group legend ── */}
      <div style={{ maxWidth: "1200px", margin: "16px auto 0", display: "flex", flexWrap: "wrap", gap: "8px", alignItems: "center" }}>
        <span style={{ fontSize: "9px", color: "#1E293B", letterSpacing: "0.1em", marginRight: "4px" }}>GROUP →</span>
        {Object.entries(gc).map(([key, g]) => (
          <div key={key} style={{ display: "flex", alignItems: "center", gap: "5px", fontSize: "9px", color: g.color + "90" }}>
            <div style={{ width: "6px", height: "6px", borderRadius: "1px", background: g.color, opacity: 0.7 }} />
            {g.label}
          </div>
        ))}
      </div>

      {/* ── Footer ── */}
      <div style={{ textAlign: "center", marginTop: "24px", fontSize: "9px", color: "#1A2234", letterSpacing: "0.08em" }}>
        NCSutcliffe · DATA: M365MAPS.COM (AARON DINNAGE) · {new Date().getFullYear()}
      </div>
    </div>
  );
}

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<DefenderPeriodicTable />);
  </script>
</body>
</html>
